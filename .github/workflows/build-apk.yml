name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap
        run: npm i -g @bubblewrap/cli

      - name: Build TWA
        run: |
          mkdir twa
          cd twa
          bubblewrap init \
            --manifest "https://allawi18.github.io/flow-tasks/manifest.json"

      - name: Package APK
        run: |
          cd twa
          bubblewrap build --skipSigning

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Flow-APK
          path: twa/app-release-unsigned.apk
          if-no-files-found: warn
